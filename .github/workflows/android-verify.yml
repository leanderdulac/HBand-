name: Android Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    name: android-${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: lint
            tasks: lintDebug lintRelease
          - check: compile
            tasks: compileReleaseKotlin compileDebugAndroidTestKotlin
          - check: test
            tasks: testDebugUnitTest
          - check: build
            tasks: assembleDebug
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare disposable verification environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          test ! -e .env
          test ! -e debug.keystore
          test ! -e app/google-services.json
          printf 'HEALTHTECH_INGEST_API_KEY=YOUR_HEALTHTECH_API_KEY_HERE\nHEALTHTECH_BASE_URL=http://127.0.0.1:9\nGEMINI_API_KEY=YOUR_GEMINI_API_KEY\n' > .env
          # Guard the two known direct external services without changing app code.
          printf '\n127.0.0.1 healthtech-secure-api-5794833455.us-central1.run.app generativelanguage.googleapis.com\n' | sudo tee -a /etc/hosts >/dev/null
          keytool -genkeypair -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -dname 'CN=Ephemeral Android CI' -keyalg RSA -keysize 2048 -validity 2
          test -n "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36.1' 'build-tools;36.0.0'
          git rev-parse HEAD
          java -version
      - name: Run Android verification
        env:
          VERIFY_TASKS: ${{ matrix.tasks }}
        shell: bash
        run: |
          set -euo pipefail
          read -r -a tasks <<< "$VERIFY_TASKS"
          bash ./gradlew "${tasks[@]}" --no-daemon --no-parallel --max-workers=1 --no-configuration-cache --console=plain
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
